version: "3.9"

services:
  # Kafka
  kafka:
    image: bitnami/kafka:3.6
    container_name: kafka
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports:
      - "9092:9092"
    networks:
      - backend


  # SSO 
  sso-db:
    image: postgres:16
    container_name: sso-db
    environment:
      POSTGRES_USER: sso
      POSTGRES_PASSWORD: sso
      POSTGRES_DB: sso
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso -d sso"]
      interval: 5s
      retries: 5
    volumes:
      - sso_pg:/var/lib/postgresql/data
    networks:
      - backend

  sso:
    build: ./sso-microservice
    container_name: sso-microservice
    depends_on:
      sso-db:
        condition: service_healthy
    environment:
      DB_DSN: postgres://sso:sso@sso-db:5432/sso?sslmode=disable
      GRPC_PORT: 50051
      KAFKA_BROKERS: kafka:9092
    expose:
      - "50051"
    networks:
      - backend


  # CATALOG SERVICE
  catalog-db:
    image: postgres:16
    container_name: catalog-db
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      retries: 5
    volumes:
      - catalog_pg:/var/lib/postgresql/data
    networks:
      - backend

  catalog-system-service:
    build: ./catalog-system-service
    container_name: catalog-system-service
    depends_on:
      catalog-db:
        condition: service_healthy
    environment:
      DB_DSN: postgres://catalog:catalog@catalog-db:5432/catalog?sslmode=disable
      GRPC_PORT: 50051
      KAFKA_BROKERS: kafka:9092
    expose:
      - "50051"
    networks:
      - backend


  # API GATEWAY

  gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      - sso
      - order
    ports:
      - "8080:8080"
    environment:
      AUTH_GRPC_ADDR: sso:50051
      ORDER_GRPC_ADDR: order:50051
    networks:
      - backend

networks:
  backend:

volumes:
  sso_pg:
  order_pg:
